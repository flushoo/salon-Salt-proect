{% extends 'base.html' %}

{% block title %}Подтверждение записи{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Вы записались на следующие услуги:</h2>
    <ul>
        {% for service in services %}
        <li>
            <img src="{{ service.image.url }}" alt="{{ service.title }}" width="50"> 
            {{ service.title }} - {{ service.price }} руб.
        </li>
        {% endfor %}
    </ul>
    <a href="{% url 'home' %}" class="btn btn-success">Перейти на главную</a>
</div>
{% endblock %}
